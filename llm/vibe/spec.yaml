schemaVersion: "2"
kind: sandbox
name: vibe
version: "0.1.0"
displayName: Mistral Vibe
description: Mistral Vibe CLI coding agent

sandbox:
  image: docker/sandbox-templates:shell-docker
  entrypoint: ["vibe"]

permissions:
  network:
    allow:
      - "*.mistral.*"
      - astral.sh
      - releases.astral.sh
      - github.com
      - objects.githubusercontent.com
      - pypi.org
      - files.pythonhosted.org

setup:
  install:
    - description: Install uv
      user: "0"
      command: >-
        curl -LsSf https://astral.sh/uv/install.sh
        | env UV_INSTALL_DIR=/usr/local/bin sh

    - description: Install Mistral Vibe
      user: "0"
      command: >-
        UV_TOOL_DIR=/opt/uv-tools UV_TOOL_BIN_DIR=/usr/local/bin
        uv tool install mistral-vibe
        && chmod -R a+rX /opt/uv-tools

    - description: Set default model to Mistral Large 4
      user: "1000"
      command: |
        set -e
        mkdir -p "$HOME/.vibe"
        if [ ! -f "$HOME/.vibe/config.toml" ]; then
        cat > "$HOME/.vibe/config.toml" <<'EOF'
        active_model = "mistral-large-4"

        [[models]]
        name = "mistral-large-4"
        provider = "mistral"
        alias = "mistral-large-4"
        thinking = "high"
        supports_images = true
        EOF
        fi
